name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release tag to verify when called by the release workflow
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate workflow syntax and context availability
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          lint_root=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")
          trap 'rm -rf "$lint_root"' EXIT
          archive="$lint_root/actionlint.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" \
            | sha256sum --check --status
          tar -xzf "$archive" -C "$lint_root" actionlint
          # v1.7.12's label table predates the available ubuntu-26.04 runner.
          # Only that label diagnostic is ignored; context errors remain fatal.
          "$lint_root/actionlint" -shellcheck= -ignore '^label "ubuntu-26.04" is unknown'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Check manifest versions
        run: node scripts/release-info.mjs
      - name: Check packaging logic
        run: node --test scripts/release-tests.mjs
      - name: Verify persistent macOS signing with disposable fixture keys
        if: runner.os == 'macOS'
        run: node scripts/test-macos-signing-ci.mjs
      - name: Type and Svelte checks (native TypeScript 7 and editor-compatible TypeScript 6)
        run: |
          pnpm check
          pnpm check:legacy
      - name: Frontend unit tests (local fixtures and mocks)
        run: pnpm test:run
      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Generate bundled third-party license notices
        run: node scripts/third-party-notices.mjs --strict
      - name: Build frontend assets
        run: pnpm build
      - name: Build isolated renderer benchmark assets (no app start)
        run: node scripts/native-render-benchmark/build.mjs
      - name: Renderer measurement collector and analysis fixtures (no process sampling)
        if: runner.os == 'Linux'
        run: |
          python3 -B scripts/native-render-benchmark/test-collector.py
          python3 -B scripts/native-render-benchmark/test-analysis.py
      - name: Native World hosted-Mac harness guards (pure, no GUI)
        if: runner.os == 'Linux'
        run: |
          python3 -B scripts/native-world-macos/test-runner.py
          node --check scripts/native-world-macos/ui.js
          node scripts/native-world-macos/test-ui.mjs
      - name: Linux GLib iterator regression (optimized)
        if: runner.os == 'Linux'
        run: |
          (cd vendor/glib && sha256sum --check COHOST-SHA256SUMS.txt)
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --test glib_variant_regression
      - name: Rust unit tests (no external accounts)
        env:
          ORBITPAL_NATIVE_FIXTURE_DIR: ${{ runner.temp }}/orbitpal-avatar-fixtures
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Renderer benchmark example compile and protocol tests (no GUI)
        run: cargo test --manifest-path src-tauri/Cargo.toml --example native_render_bench --features native-render-benchmark --locked
      - name: Linux disposable credential fixture dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gnome-keyring libglib2.0-bin
      - name: Credential fixture isolation guards (no native store access)
        run: node --test scripts/keyring-compat-tests.mjs
      - name: Native credential migration (synthetic entries in disposable stores)
        run: node scripts/test-keyring-compat-ci.mjs
      - name: Restore disposable credential fixture keychains
        if: always() && runner.os == 'macOS'
        run: node scripts/test-keyring-compat-ci.mjs --cleanup
      - name: Offline compressed-avatar WebGL fixtures (installed Chrome)
        env:
          ORBITPAL_NATIVE_FIXTURE_DIR: ${{ runner.temp }}/orbitpal-avatar-fixtures
        run: pnpm test:avatar-decoders
      - name: Build Windows installer migration fixtures (no signing secrets)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm tauri build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upgrade published 0.7.0 Windows NSIS and MSI installs without starting the app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-upgrade.ps1
