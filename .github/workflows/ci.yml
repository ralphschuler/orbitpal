name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release tag to verify when called by the release workflow
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Check manifest versions
        run: node scripts/release-info.mjs
      - name: Check packaging logic
        run: node --test scripts/release-tests.mjs
      - name: Type and Svelte checks
        run: pnpm check
      - name: Frontend unit tests (local fixtures and mocks)
        run: pnpm test:run
      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Generate bundled third-party license notices
        run: node scripts/third-party-notices.mjs --strict
      - name: Build frontend assets
        run: pnpm build
      - name: Linux GLib iterator regression (optimized)
        if: runner.os == 'Linux'
        run: |
          (cd vendor/glib && sha256sum --check COHOST-SHA256SUMS.txt)
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --test glib_variant_regression
      - name: Rust unit tests (no external accounts)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows installer migration fixtures (no signing secrets)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm tauri build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upgrade published 0.7.0 Windows NSIS and MSI installs without starting the app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-upgrade.ps1
