name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - name: JavaScript dependency advisories
        run: pnpm audit --audit-level low
      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Rust dependency advisories
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Legacy credential migration reference advisories (test-only lockfile)
        run: cargo audit --file scripts/fixtures/keyring-compat/Cargo.lock
      # Local GLib source is checked against the documented upstream backport
      # by optimized tests and source hashes in CI; do not add advisory ignores.
