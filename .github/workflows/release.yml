name: Release desktop applications

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.6.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) throw new Error('TAURI_SIGNING_PRIVATE_KEY must be configured before publishing signed updater packages')"
      - name: Require matching manifests and an existing version tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release-info.mjs "$RELEASE_TAG"
          tagged_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          test "$tagged_commit" = "$(git rev-parse HEAD)"
          node scripts/release-provenance.mjs --context
      - name: Require the reviewed persistent macOS certificate policy
        run: node scripts/macos-signing-policy.mjs

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}
    permissions:
      contents: read

  build:
    needs: [validate, verify]
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundles: nsis,msi
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Generate bundled third-party license notices
        run: node scripts/third-party-notices.mjs --strict
      - name: Build macOS packages (persistent self-signed identity, not notarized)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOS_CODESIGN_P12: ${{ secrets.MACOS_CODESIGN_P12 }}
          MACOS_CODESIGN_PASSWORD: ${{ secrets.MACOS_CODESIGN_PASSWORD }}
        run: node scripts/macos-release-signing.mjs build
      - name: Remove temporary macOS signing identity
        if: always() && runner.os == 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: node scripts/macos-release-signing.mjs cleanup
      - name: Verify signed macOS identity and microphone access
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: node scripts/verify-macos-permissions.mjs "src-tauri/target/$RUST_TARGET/release/bundle/macos/OrbitPal.app"
      - name: Build Windows or Linux packages (updater signed, no OS code-signing identity)
        if: runner.os != 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target "$RUST_TARGET" --bundles "$BUNDLES"
      - name: Linux GLib iterator regression (optimized)
        if: runner.os == 'Linux'
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          (cd vendor/glib && sha256sum --check COHOST-SHA256SUMS.txt)
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --target "$RUST_TARGET" --test glib_variant_regression
      - name: Collect versioned platform downloads
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: node scripts/collect-release.mjs
      - name: Attach dependency and license inventories
        if: runner.os == 'Linux'
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/dependency-inventories.mjs
      - name: Attest the actual platform build outputs
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/*
          create-storage-record: false
      - name: Retain the platform Sigstore bundle for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-${{ matrix.platform }}
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify every platform artifact against the tagged build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: node scripts/release-provenance.mjs release-artifacts
      - name: Cryptographically verify all five updater payloads and create the manifest
        # Offline Node crypto reads only the embedded public key. Release
        # signing secrets are never exposed to this job.
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: node scripts/updater-manifest.mjs release-artifacts
      - name: Add source archive and SHA-256 checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git archive --format=zip --prefix=orbitpal/ --output="$PWD/release-artifacts/OrbitPal-v$RELEASE_VERSION-source.zip" "$RELEASE_TAG"
          node scripts/checksums.mjs release-artifacts
      - name: Publish only after every platform and test job succeeded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          node scripts/updater-manifest.mjs --check-latest
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::This release already exists. Published downloads are never overwritten automatically. Resolve an unfinished draft explicitly or use a new version.'
            exit 1
          fi
          options=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false --title "OrbitPal $RELEASE_TAG" --notes-file docs/RELEASE-NOTES-TEMPLATE.md --generate-notes)
          if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${options[@]}" release-artifacts/*
          latest=true
          if [ "$PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
