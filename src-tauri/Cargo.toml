[package]
name = "streamer-ai-cohost"
version = "0.6.1"
description = "An extensible AI streaming companion"
authors = ["Streamer AI Cohost"]
edition = "2021"

[lib]
name = "streamer_ai_cohost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Only Tauri v2 artifacts are published. Disable legacy v1 ZIP compatibility,
# retaining the default TLS and system proxy support without vulnerable ZIP v4.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.23"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
pdf-extract = "0.12.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Exercise the same patched GLib already required by the Linux runtime.
glib = "=0.18.5"

[[test]]
name = "glib_variant_regression"
path = "../vendor/glib/cohost-regression.rs"

[patch.crates-io]
# Original 0.18.5 plus the two-line upstream RUSTSEC-2024-0429 fix.
glib = { path = "../vendor/glib" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
