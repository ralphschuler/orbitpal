[package]
name = "orbitpal"
version = "0.12.0"
description = "An extensible AI streaming companion"
authors = ["OrbitPal contributors"]
edition = "2021"

[lib]
name = "orbitpal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Opt-in nonshipping renderer measurement; no default/release feature changes.
native-render-benchmark = []

[[example]]
name = "native_render_bench"
path = "examples/native_render_bench.rs"
required-features = ["native-render-benchmark"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Only Tauri v2 artifacts are published. Disable legacy v1 ZIP compatibility,
# retaining the default TLS and system proxy support without vulnerable ZIP v4.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bounded process-only native action profile-change fence.
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync", "net"] }
# Supply the same Mozilla trust store explicitly: the upstream bundled-root
# feature still pins the audited webpki-roots 0.26 compatibility wrapper.
tokio-tungstenite = { version = "0.28", features = ["__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.10"
futures-util = "0.3"
base64 = "0.23"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
pdf-extract = "0.12.1"
keyring-core = "1.0.1"
# Only retained, opt-in session copies; the OS remains the persistent store.
zeroize = "1"
# Screenshot pixels remain in memory; enable only the JPEG codec we send.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keep the legacy file-based User Keychain and service/account mapping.
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
core-graphics = "0.25"
core-foundation-sys = "0.8"
foreign-types = "0.5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSNotification", "NSDistributedNotificationCenter", "NSObject", "NSOperation", "block2"] }
block2 = "0.6"

[target.'cfg(unix)'.dependencies]
# Already present transitively; use platform-defined no-follow/nonblocking flags.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Persistent synchronous Secret Service; never replace with a volatile keyutils store.
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
zbus = { version = "6.0", default-features = false, features = ["tokio", "proxy"] }
pipewire = "0.10.1"
# Pure Rust X11/RandR transport: no libxcb generator or portal temp files.
x11rb = { version = "0.14", default-features = false, features = ["randr", "image"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "6.0", default-features = false, features = ["tokio", "proxy", "p2p", "bus-impl", "service"] }
# Exercise the same patched GLib already required by the Linux runtime.
glib = "=0.18.5"

[[test]]
name = "glib_variant_regression"
path = "../vendor/glib/cohost-regression.rs"

[patch.crates-io]
# Original 0.18.5 plus the two-line upstream RUSTSEC-2024-0429 fix.
glib = { path = "../vendor/glib" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
